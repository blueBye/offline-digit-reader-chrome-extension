<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Offline Digit Reader</title></head><body class="popup"><h1>Offline Digit Reader</h1><p>Select the <b>image</b>, <b>input</b>, <b>refresh</b>, and <b>submit</b> controls in that order. An on-page banner displays OCR status; the model runs in an offscreen document, so the old reader window is no longer needed.</p><button id="select" class="primary">Select four elements</button><button id="stop" hidden>Stop monitoring</button><p id="status" class="status" role="status">Everything runs locally.</p><script type="module" src="/src/popup.js"></script></body></html>
