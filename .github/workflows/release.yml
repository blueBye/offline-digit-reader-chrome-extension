name: Build and release Chrome extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and verify local OCR models
        run: pnpm run models:setup

      - name: Run tests
        run: pnpm test

      - name: Build extension
        run: pnpm run build

      - name: Check extension manifest
        run: |
          test -s dist/manifest.json
          python3 -m json.tool dist/manifest.json >/dev/null

      - name: Package unpacked extension
        shell: bash
        run: |
          mkdir -p release
          cd dist
          zip -q -r ../release/offline-digit-reader-${{ github.ref_name }}.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-digit-reader-${{ github.ref_name }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
